spring.application.name=openfeign-service
server.port=8082
# use a count-based sliding window
resilience4j.circuitbreaker.instances.sachin.slidingWindowType=COUNT_BASED
# track the last 10 calls
resilience4j.circuitbreaker.instances.sachin.slidingWindowSize=10
# evaluate the failure rate after at least 5 calls (default is 100, which is why the circuit never opened)
resilience4j.circuitbreaker.instances.sachin.minimumNumberOfCalls=5
# open the circuit breaker if 50% of the last 10 calls failed
resilience4j.circuitbreaker.instances.sachin.failureRateThreshold=50
# wait for 10 seconds before transitioning from open to half-open state
resilience4j.circuitbreaker.instances.sachin.waitDurationInOpenState=10s
# automatically move from open to half-open without needing a call
resilience4j.circuitbreaker.instances.sachin.automaticTransitionFromOpenToHalfOpenEnabled=true
# allow 3 calls to pass through when in half-open state
resilience4j.circuitbreaker.instances.sachin.permittedNumberOfCallsInHalfOpenState=3
# record these exceptions as failures
resilience4j.circuitbreaker.instances.sachin.registerHealthIndicator=true

# actucator configuration
management.endpoints.web.exposure.include=*
